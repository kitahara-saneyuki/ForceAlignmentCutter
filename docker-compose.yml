version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forcealignmentcutter-api
    network_mode: host
    volumes:
      # Mount uploads directory for persistence
      - ./uploads:/app/uploads
      # Mount static files for web interface
      - ./static:/app/static
      # Mount source code for development (comment out for production)
      - ./api:/app/api
      - ./src:/app/src
      # Mount Hugging Face cache to persist downloaded models
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      # Hugging Face cache directory
      - HF_HOME=/root/.cache/huggingface
      # Proxy settings (use localhost since we're on host network)
      - http_proxy=http://127.0.0.1:7890
      - https_proxy=http://127.0.0.1:7890
      - HTTP_PROXY=http://127.0.0.1:7890
      - HTTPS_PROXY=http://127.0.0.1:7890
      - no_proxy=localhost,127.0.0.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: forcealignmentcutter-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - fastapi
    restart: unless-stopped
    profiles:
      - production

volumes:
  uploads:
    driver: local
